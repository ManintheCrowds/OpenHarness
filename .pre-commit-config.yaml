# Harness pre-commit: secret scanning plus SCP validation for handoff/state.
# Install: pip install -r requirements.txt pre-commit && pre-commit install
# Run manually: pre-commit run --all-files
#
# Paths: harness uses state/ at repo root. When copying to a project with .cursor/state/,
# update the state/ file patterns below to ^\.cursor/state/ and point sanitize-input at
# python .cursor/scripts/sanitize_input.py.
#
# gitleaks CLI is pinned to the v8.30.1 tag (pre-commit rev below), same as SCP PR #97.
# mask-check calls the installed SCP masker (requirements.txt). It does not vendor the module.
# TODO: repin scp-mcp to a main SHA once https://github.com/ManintheCrowds/SCP/pull/97 merges.

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      # Same check as MiscRepos mask-secrets: python masker --check on handoff/state.
      # Case-insensitive. state/ text files, HANDOFF.md, handoffs/, and next_prompt files.
      # Entry is SCP's module, not a copied script.
      # -W hides a runpy RuntimeWarning: importing scp loads mask_secrets before
      # `python -m scp.mask_secrets` executes that module.
      - id: mask-check
        name: Mask secrets check (handoff/state)
        entry: python -W ignore::RuntimeWarning -m scp.mask_secrets --check
        language: system
        files: '(?i)(?:^state/.+\.(?:md|json|jsonl|txt|yaml|yml)$|(?:^|/)HANDOFF\.md$|(?:^|/)handoffs/.+\.(?:md|json|jsonl|txt|yaml|yml)$|(?:^|/)[^/]*next_prompt[^/]*\.(?:md|json|jsonl|txt|yaml|yml)$)'
        stages: [pre-commit]

      - id: sanitize-input
        name: Sanitize input (handoff/state)
        entry: python scripts/sanitize_input.py
        language: system
        files: ^state/.*\.md$
        stages: [pre-commit]

      - id: handoff-scp
        name: Handoff SCP validation
        entry: python scripts/validate_handoff_scp.py
        language: system
        files: ^state/handoff_latest\.md$
        pass_filenames: false
        stages: [pre-commit]

      - id: verify-script-index
        name: Script index CHEATSHEET + capabilities manifest parity
        entry: python scripts/verify_script_index.py
        language: system
        files: ^(docs/CHEATSHEET\.md|capabilities\.harness\.yaml|scripts/.*)$
        pass_filenames: false
        stages: [pre-commit]

      - id: verify-skills-readme
        name: Skills README vs SKILL.md descriptions
        entry: python scripts/verify_skills_readme.py
        language: system
        files: ^(\.cursor/skills/README\.md|\.cursor/skills/.*/SKILL\.md)$
        pass_filenames: false
        stages: [pre-commit]

      - id: verify-contract-hash
        name: SCP contract SHA-256 fingerprint
        entry: python scripts/verify_contract_hash.py
        language: system
        files: ^docs/contracts/scp_mcp_v1\.(md|sha256)$
        pass_filenames: false
        stages: [pre-commit]
