# Gitleaks config read by the pre-commit hook pinned to v8.30.1.
# Docs: https://github.com/gitleaks/gitleaks

title = "openharness"

# Allowlist-only files do not load built-in rules. Extend so the pinned CLI scans.
[extend]
useDefault = true

# Synthetic mask-check fixtures only. Do not put real credentials here.
[allowlist]
description = "Synthetic mask-check fixtures."
paths = [
  '''tests/fixtures/''',
]
